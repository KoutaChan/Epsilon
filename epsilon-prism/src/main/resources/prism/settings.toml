# Epsilon-Prism（PRISM-min）の同梱既定設定。同梱値 < 選択した TOML（--settings）< 明示上書き（-Depsilon.*）の順に適用する。
# 省略した項目は同梱値を使う。

[epsilon.devices]

# trueなら明示したGPU番号が認識された範囲内か事前確認する。falseでも指定書式は検証される。
validateIndices = false

# 版を開く既定の device。空ならGPUを番号順に全て使い、GPUがなければCPU。cpu・gpu:0・gpu:0,gpu:1 のように書く。
inference = ""

# 新しい run の設定。鍵は run の config.json の欄の名前と同じで、train が新しい run を始めるときだけ読む（再開は config.json を読む）。
# evaluate のバッチ・device・seed もここから読む。
[epsilon.prism]
# 牌山・抽選・網の初期値の種
seed = 20261010
# 1コホートの半荘の数と反復の数
gamesPerCohort = 65536
iterations = 400
# commonの順位効用（TENHOU / PLACEMENT / TOP / LAST_AVOIDANCE / MLEAGUE）
utility = "TENHOU"

# 収集。device は cpu か gpu0,gpu1 のような GPU の列
collectDevices = "gpu0,gpu1"
maxActiveGames = 8192
advanceWorkers = 28
encoders = 20
slots = 2
readyBatches = 4
inferBatch = 4096
multiTransitionBatch = 4096
batchWaitMicros = 100000
rowWriters = 4

# 行動方策 b: 凍結した π_t の貪欲（s の argmax）に一様の床 ε_b（全席）。保留（HOLDOUT）にする半荘の割合
epsilonB = 0.005
holdoutFraction = 0.05

# ラベル行（M1、K = 1）: 判断の類ごとの率 ρ（脅威のない打牌は段階ごと、確約の類 = 脅威のもとの打牌・立直・鳴き・槓・和了と九種）。
# 候補集合 C(o) は s の上位 3・p0 の上位 2・体制の代表・確率 ε_C で一様な 1 手（双子はまとめる。最大 maxCandidates）
labelRateDiscardEarly = 0.004
labelRateDiscardMid = 0.006
labelRateDiscardLate = 0.008
labelRateCommit = 0.08
maxCandidates = 6
# 打牌の類（脅威のない序盤・中盤・終盤）では全ての合法手を測る（候補集合を全ての合法手にする）
measureAllDiscards = false
epsilonC = 0.1

# 中立ロールイン（M2）: 写しを作る率 β（打牌の類・確約の類）、逸脱の分布 q の一様な床 ε_q、写しの中の逸脱した席の判断を
# ラベル行にする率 ρ_br と写しごとの上限
rollinRateDiscard = 0.002
rollinRateCommit = 0.03
epsilonQ = 0.1
rhoBranch = 0.3
maxCopyLabels = 2

# 規則事前 p0（CRR の R0 の係数 c = 1）: 打牌後の向聴 1 つあたりと受け入れ 1 枚あたりの nat
priorAlpha = 4.0
priorGamma = 0.05

# 網。learnerDevice は先頭が正本で、残りはデータ並列の複製。hidden は白紙から始めるときの幅（startSnapshot からなら版の幅）
learnerDevice = "gpu1,gpu0"
hidden = 256
precision = "BFLOAT16"
# 版 1 にする epsilon-prism の版（空なら白紙の網）
startSnapshot = ""

# データの記憶: 生徒と蒸留に使う直近のコホートの数の上限と、年齢 a（最新が 0）のコホートのラベル行のうち使う割合 memoryDecay^a。
# memoryDecay = 1 なら全てのコホートを同じ重みで使う（以前の窓 W と同じ）。行は行の番号からの決定的な硬貨で間引くので、再開しても同じ行になる
memoryCohorts = 4
memoryDecay = 1.0
# 生徒と蒸留（M3）: 残す行のコホートの数（memoryCohorts 以上）、生徒 1 本の歩数、蒸留の歩数、バッチ、学習率（cosine）、
# 勾配のノルムの上限（0 なら切らない）、展開のスレッド数
keepCohorts = 4
fitSteps = 2000
distillSteps = 1000
# 1 行を見る回数の上限（周回数）。歩数は min(上限の歩数, ceil(周回数 × 行 ÷ バッチ))。E1 では分岐行を 3.7 周すると全ての損失で悪化し、
# 0.6 周なら悪化しなかった
fitEpochs = 0.6
distillEpochs = 1.0
batchSize = 4096
lrPeak = 2e-4
lrFloor = 1e-5
gradientClip = 0.5
decodeThreads = 48
# 差分整合の温度 λ（打牌の類・確約の類）と C の外の質量を下げる項の係数 κ
lambdaDiscard = 0.01
lambdaCommit = 0.02
# κ は既定 0: E1 では κ = 0.02 で手の差の傾きが 0.63〜0.54 に崩れ、3×H も 2.29 に悪化した（κ = 0 は 2.198）
kappa = 0.0
# KL の基準: "prior" = 規則事前 p0_C（最適は s = Y + λ·log p0 で、貪欲が向聴・受け入れの良い手へ傾く）、"uniform" = C の上の一様（E1 と同じ、
# 最適は s = Y + 定数）。prism-1025 の反復 1 の行で比べると（16384 局）、prior は候補が放銃 10.1% → 17.3% の押しすぎで 3×H 2.282 → 2.291、
# uniform は放銃 10.3% のまま 2.282 → 2.233
klReference = "uniform"

# 学習の網の作り方。"crossfit" = 組 A・B の生徒を交差適合し、その平均を蒸留する（認証の量を出す）。"single" = 生徒 1 本を両方の組の TRAIN の行で
# 当てて、そのまま学習の網にする（蒸留と認証はしない。保留の指標は HOLDOUT の行で今までどおり測る）
learner = "crossfit"

# 方策の記憶: 打つ網 A を学習の網 θ の重み付きの平均にする（A_v = (1 − η)·A_{v−1} + η·θ_v）。
#   averaging = "none"（平均しない）、"ema"（η = 1 − 2^(−1/averageHalfLife)）、"power"（版 k の重み k^averagePower、0 で一様、1 で線形 CFR）
#   averageFrom: 平均を始める版。collectWith: 収集で打つ網（"average" か "iterate"）。learnFrom: 生徒と蒸留を始める網（"iterate" か "average"）。
#   evaluateIterate: 打つ網に加えて学習の網も 3×Heuristic で測る。prism-1025-uni の版 6〜13 の重みの平均は最新の版より 3×H で 0.027 良かった
averaging = "none"
averageHalfLife = 8.0
averagePower = 1.0
averageFrom = 1
collectWith = "average"
learnFrom = "iterate"
evaluateIterate = false

# 認証（S）: true なら確約の類の (Î_A + Î_B)/2 − 2·se > −certifyTolerance で、かつ確約の類の乗り換えのうち C の外（測れない）だった割合が
# certifyMaxOutsideShare 以下のときだけ蒸留した網を受け入れる（false でも認証の量は報告する）。Î は判断 1 つあたりの改善（効用の単位）
certify = true
certifyTolerance = 0.0005
certifyMaxOutsideShare = 0.02

# Φ: "grp"（固定の GRP。train では grpCheckpoint が必須）か "score-rank"（局末の点数を最終順位とみなす試験用の代用）
phi = "grp"
grpCheckpoint = ""
grpDevice = "cpu"
grpBatch = 256

# 評価: 3×Heuristic（evalEvery 反復ごと、0 なら測らない）
evalEvery = 1
evalGames = 4096
